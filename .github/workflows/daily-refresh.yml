name: Daily data refresh

on:
  schedule:
    # 21:30 UTC — after US close; Asia/Europe markets closed hours earlier
    - cron: "30 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  # ── Stage 0: AI commodity outlook (one global call, applied by every market) ──
  outlook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # the outlook reads 30-day spot changes from the station DBs
      - name: Download databases from the db-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download db-latest -p 'screener_*.db'

      - name: AI commodity outlook
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python scripts/ai_overlay.py outlook || true

      - name: Commit outlook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_outlook.json || true
          if git diff --cached --quiet; then
            echo "No outlook changes."
          else
            git commit -m "chore(ai): daily commodity outlook ($(date -u +%Y-%m-%d))"
            git push
          fi

  # ── Stage 1: per-market refresh + AI review ──────────────────────────────────
  refresh:
    needs: outlook
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      max-parallel: 2          # be gentle on Yahoo rate limits
      fail-fast: false
      matrix:
        market: [ca, us, uk, za, id, hk, cn]
    env:
      MARKET: ${{ matrix.market }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The DB carries the snapshot history, so a missing asset fails the job
      # instead of starting an empty one.
      - name: Download database from the db-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          db=screener_${{ matrix.market }}.db
          gh release download db-latest -p "$db"
          # Sunday: keep the pre-refresh DB as this week's fallback copy
          if [ "$(date -u +%u)" = 7 ]; then cp "$db" "weekly_$db"; fi

      - name: Run daily refresh (${{ matrix.market }})
        run: |
          python - <<'PYEOF'
          import logging, sqlite3, os
          logging.basicConfig(level=logging.INFO, format="%(asctime)s %(levelname)s %(message)s")
          from scheduler.jobs import run_daily_refresh
          run_daily_refresh()
          import config
          conn = sqlite3.connect(config.DB_PATH)
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
          conn.close()
          PYEOF

      - name: AI review of top candidates (${{ matrix.market }})
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
        run: python scripts/ai_overlay.py review --market ${{ matrix.market }} || true

      # The refresh swallows its own errors, so check the DB before it replaces
      # the good one. --clobber deletes the old asset before uploading, so retry:
      # the only other copies are the Sunday weekly_ copy and what the apps hold.
      - name: Upload database to the db-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          db=screener_${{ matrix.market }}.db
          python -c "import sqlite3, sys; c = sqlite3.connect(sys.argv[1]); assert c.execute('PRAGMA quick_check').fetchone()[0] == 'ok'; assert c.execute('SELECT COUNT(*) FROM stock_snapshots').fetchone()[0] > 0" "$db"
          for i in 1 2 3; do
            gh release upload db-latest "$db" --clobber && break
            [ "$i" = 3 ] && exit 1
            sleep $((i * 20))
          done
          [ ! -f "weekly_$db" ] || gh release upload db-latest "weekly_$db" --clobber ||
            echo "::warning::weekly copy of $db not uploaded"

      - name: Commit AI overlay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai_overlay_${{ matrix.market }}.json || true
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "chore(${{ matrix.market }}): daily AI overlay ($(date -u +%Y-%m-%d))"
            # retry push in case parallel matrix jobs race
            for i in 1 2 3 4 5; do
              git push && break
              git pull --rebase && sleep $((i * 5))
            done
          fi
